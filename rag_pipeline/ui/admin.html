<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị quyền — Local RAG</title>
  <style>
    :root { color-scheme:dark; --bg:#080d1b; --panel:#111a2d; --panel-2:#0d1527; --line:#263756; --text:#eef3ff; --muted:#8e9dbb; --accent:#73e3b6; --accent-strong:#b6f5da; --danger:#f29a9a; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% -10%, #1d3157 0, transparent 38%), linear-gradient(145deg, #0a1020, var(--bg) 60%); color:var(--text); font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(1080px, calc(100% - 36px)); margin:0 auto; padding:30px 0 44px; }
    a { color:var(--accent-strong); text-decoration:none; }
    .hero { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:22px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:5px 0 4px; font-size:clamp(32px,5vw,52px); line-height:1; letter-spacing:-.055em; }
    .subtitle { margin:0; color:var(--muted); font-size:15px; }
    .back { font-size:13px; }
    .hero-mark { display:grid; place-items:center; width:54px; height:54px; border:1px solid #4d7691; border-radius:16px; color:var(--accent-strong); background:#15334a; box-shadow:0 12px 32px #0004; font-weight:900; letter-spacing:-.08em; }
    .panel { background:rgba(17,26,45,.92); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 20px 60px #0004; }
    .section-head, .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .section-label { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    .section-title { margin-top:3px; font-size:16px; font-weight:800; }
    .login-form { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:9px; align-items:center; margin-top:14px; }
    input, select { width:100%; border:1px solid var(--line); background:#091224; color:var(--text); border-radius:9px; padding:10px 11px; font:inherit; outline:none; }
    input:focus, select:focus { border-color:#5b9db0; box-shadow:0 0 0 3px #5b9db022; }
    button { border:0; border-radius:9px; min-height:38px; padding:0 15px; background:var(--accent); color:#072018; font-weight:800; cursor:pointer; }
    button.secondary { background:#263654; color:var(--text); }
    button:disabled { opacity:.55; cursor:wait; }
    .status { color:var(--muted); margin-top:12px; min-height:20px; font-size:12px; }
    .status.error { color:var(--danger); }
    .session-bar { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
    .identity { color:var(--muted); }
    #admin-panel { margin-top:12px; }
    .admin-summary { color:var(--muted); font-size:12px; }
    .toolbar { margin-bottom:14px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:680px; overflow:hidden; }
    th, td { text-align:left; padding:12px 10px; border-bottom:1px solid #1b2740; vertical-align:middle; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    td small { display:block; color:var(--muted); overflow-wrap:anywhere; }
    .role-list { color:var(--accent-strong); font-weight:800; }
    .role-action { display:flex; gap:8px; align-items:center; }
    .role-action select { padding:7px 9px; }
    .empty { color:var(--muted); padding:18px 0; }
    @media (max-width:650px) { main { width:calc(100% - 20px); padding-top:22px; } .hero-mark { display:none; } .login-form { grid-template-columns:1fr; } .login-form button { width:100%; } }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <a class="back" href="/">← Về Local RAG</a>
      <div class="eyebrow">Admin workspace</div>
      <h1>Quản trị quyền</h1>
      <p class="subtitle">Quản lý role và phạm vi tài liệu được phép đọc.</p>
    </div>
    <div class="hero-mark" aria-hidden="true">A</div>
  </header>

  <section class="panel">
    <div class="section-head">
      <div>
        <div class="section-label">Secure access</div>
        <div class="section-title">Đăng nhập quản trị</div>
      </div>
      <span class="admin-summary">Chỉ role admin được phép tiếp tục</span>
    </div>
    <form id="login-form" class="login-form">
      <input id="email" type="email" placeholder="Email admin" autocomplete="username" required>
      <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button type="submit">Đăng nhập admin</button>
    </form>
    <div class="toolbar" id="session-bar" hidden>
      <span id="identity" class="identity"></span>
      <button id="logout" class="secondary" type="button">Đăng xuất</button>
    </div>
    <div id="status" class="status">Chưa đăng nhập.</div>
  </section>

  <section id="admin-panel" class="panel" hidden>
    <div class="toolbar">
      <div>
        <div class="section-label">Access control</div>
        <div class="section-title">Danh sách user</div>
      </div>
      <button id="refresh" class="secondary" type="button">Làm mới</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Role hiện tại</th>
            <th>Đặt role</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem("rag-access-token") || "";

  function setStatus(message, error = false) {
    $("status").textContent = message;
    $("status").classList.toggle("error", error);
  }

  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});
    if (token) headers.set("Authorization", "Bearer " + token);
    const response = await fetch(path, {...options, headers});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = Array.isArray(data.detail)
        ? data.detail.map((item) => item.msg || item.message || JSON.stringify(item)).join("; ")
        : typeof data.detail === "object"
          ? JSON.stringify(data.detail)
          : data.detail;
      throw new Error(detail || "Request thất bại");
    }
    return data;
  }

  function showLogin(message) {
    $("login-form").hidden = false;
    $("session-bar").hidden = true;
    $("admin-panel").hidden = true;
    setStatus(message || "Chưa đăng nhập.");
  }

  function showAdmin(user) {
    $("login-form").hidden = true;
    $("session-bar").hidden = false;
    $("admin-panel").hidden = false;
    $("identity").textContent = user.email + " · role=" + user.roles.join(", ");
  }

  function logout(message = "Đã đăng xuất.") {
    token = "";
    localStorage.removeItem("rag-access-token");
    localStorage.removeItem("rag-session-user-id");
    showLogin(message);
  }

  async function loadUsers() {
    $("users").replaceChildren();
    setStatus("Đang tải danh sách user…");
    try {
      const users = await api("/auth/users");
      if (!users.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent = "Chưa có user.";
        row.append(cell);
        $("users").append(row);
      } else {
        users.forEach(renderUser);
      }
      setStatus("Đã tải " + users.length + " user.");
    } catch (error) {
      setStatus(error.message, true);
    }
  }

  function renderUser(user) {
    const row = document.createElement("tr");

    const identity = document.createElement("td");
    identity.textContent = user.email;
    const name = document.createElement("small");
    name.textContent = user.display_name || "Không có tên hiển thị";
    identity.append(name);

    const roles = document.createElement("td");
    roles.className = "role-list";
    roles.textContent = user.roles.length ? user.roles.join(", ") : "none";

    const action = document.createElement("td");
    const controls = document.createElement("div");
    controls.className = "role-action";
    const select = document.createElement("select");
    select.setAttribute("aria-label", "Role mới của " + user.email);
    ["staff", "manager"].forEach((role) => {
      const option = document.createElement("option");
      option.value = role;
      option.textContent = role;
      option.selected = user.roles.includes(role);
      select.append(option);
    });
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "Lưu";
    button.onclick = async () => {
      button.disabled = true;
      try {
        await api("/auth/users/" + user.id + "/role", {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({role: select.value}),
        });
        await loadUsers();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        button.disabled = false;
      }
    };
    controls.append(select, button);
    action.append(controls);

    const active = document.createElement("td");
    active.textContent = user.is_active ? "Đang hoạt động" : "Đã khoá";

    row.append(identity, roles, action, active);
    $("users").append(row);
  }

  $("login-form").onsubmit = async (event) => {
    event.preventDefault();
    setStatus("Đang đăng nhập…");
    try {
      const data = await api("/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          email: $("email").value.trim(),
          password: $("password").value,
        }),
      });
      if (!(data.user.roles || []).includes("admin")) {
        token = "";
        throw new Error("Tài khoản này không có quyền admin.");
      }
      token = data.access_token;
      localStorage.setItem("rag-access-token", token);
      localStorage.setItem("rag-session-user-id", data.user.id);
      showAdmin(data.user);
      await loadUsers();
    } catch (error) {
      logout(error.message);
      $("password").value = "";
      setStatus(error.message, true);
    }
  };

  $("refresh").onclick = loadUsers;
  $("logout").onclick = () => logout();

  (async () => {
    if (!token) {
      showLogin();
      return;
    }
    try {
      const user = await api("/auth/me");
      if (!(user.roles || []).includes("admin")) {
        logout("Chỉ admin mới được vào trang này.");
        return;
      }
      showAdmin(user);
      await loadUsers();
    } catch (error) {
      logout("Phiên đăng nhập hết hạn.");
    }
  })();
</script>
</body>
</html>
