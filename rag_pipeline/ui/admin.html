<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị quyền — Local RAG</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2b; --line:#263451; --text:#e8eefc; --muted:#91a0bd; --accent:#6ee7b7; --danger:#ef8f8f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top, #182542, var(--bg) 55%); color:var(--text); font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(1050px, calc(100% - 32px)); margin:0 auto; padding:38px 0 48px; }
    a { color:var(--accent); }
    h1 { margin:12px 0 6px; font-size:clamp(26px,5vw,42px); letter-spacing:-.03em; }
    .subtitle { margin:0 0 28px; color:var(--muted); }
    .panel { background:rgba(18,26,43,.92); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 18px 50px #0003; }
    .login-form { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select { border:1px solid var(--line); background:#0b1222; color:var(--text); border-radius:8px; padding:10px 11px; font:inherit; }
    input { min-width:230px; }
    button { border:0; border-radius:9px; padding:10px 15px; background:var(--accent); color:#082017; font-weight:700; cursor:pointer; }
    button.secondary { background:#263451; color:var(--text); }
    button:disabled { opacity:.55; cursor:wait; }
    .status { color:var(--muted); margin-top:12px; min-height:24px; }
    .status.error { color:var(--danger); }
    .toolbar { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px; }
    .identity { color:var(--muted); }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:680px; }
    th, td { text-align:left; padding:12px 10px; border-bottom:1px solid #1b2740; vertical-align:middle; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    td small { display:block; color:var(--muted); overflow-wrap:anywhere; }
    .role-list { color:var(--accent); font-weight:700; }
    .role-action { display:flex; gap:8px; align-items:center; }
    .role-action select { padding:7px 9px; }
    .empty { color:var(--muted); padding:18px 0; }
    @media (max-width:600px) { main { width:calc(100% - 20px); padding-top:22px; } input { min-width:0; width:100%; } .login-form button { flex:1; } }
  </style>
</head>
<body>
<main>
  <a href="/">← Về Local RAG</a>
  <h1>Quản trị quyền</h1>
  <p class="subtitle">Chỉ tài khoản có role <strong>admin</strong> mới xem và thay đổi quyền user.</p>

  <section class="panel">
    <form id="login-form" class="login-form">
      <input id="email" type="email" placeholder="Email admin" autocomplete="username" required>
      <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button type="submit">Đăng nhập admin</button>
    </form>
    <div class="toolbar" id="session-bar" hidden>
      <span id="identity" class="identity"></span>
      <button id="logout" class="secondary" type="button">Đăng xuất</button>
    </div>
    <div id="status" class="status">Chưa đăng nhập.</div>
  </section>

  <section id="admin-panel" class="panel" hidden>
    <div class="toolbar">
      <strong>Danh sách user</strong>
      <button id="refresh" class="secondary" type="button">Làm mới</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Role hiện tại</th>
            <th>Đặt role</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem("rag-access-token") || "";

  function setStatus(message, error = false) {
    $("status").textContent = message;
    $("status").classList.toggle("error", error);
  }

  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});
    if (token) headers.set("Authorization", "Bearer " + token);
    const response = await fetch(path, {...options, headers});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = Array.isArray(data.detail)
        ? data.detail.map((item) => item.msg || item.message || JSON.stringify(item)).join("; ")
        : typeof data.detail === "object"
          ? JSON.stringify(data.detail)
          : data.detail;
      throw new Error(detail || "Request thất bại");
    }
    return data;
  }

  function showLogin(message) {
    $("login-form").hidden = false;
    $("session-bar").hidden = true;
    $("admin-panel").hidden = true;
    setStatus(message || "Chưa đăng nhập.");
  }

  function showAdmin(user) {
    $("login-form").hidden = true;
    $("session-bar").hidden = false;
    $("admin-panel").hidden = false;
    $("identity").textContent = user.email + " · role=" + user.roles.join(", ");
  }

  function logout(message = "Đã đăng xuất.") {
    token = "";
    localStorage.removeItem("rag-access-token");
    localStorage.removeItem("rag-session-user-id");
    showLogin(message);
  }

  async function loadUsers() {
    $("users").replaceChildren();
    setStatus("Đang tải danh sách user…");
    try {
      const users = await api("/auth/users");
      if (!users.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent = "Chưa có user.";
        row.append(cell);
        $("users").append(row);
      } else {
        users.forEach(renderUser);
      }
      setStatus("Đã tải " + users.length + " user.");
    } catch (error) {
      setStatus(error.message, true);
    }
  }

  function renderUser(user) {
    const row = document.createElement("tr");

    const identity = document.createElement("td");
    identity.textContent = user.email;
    const name = document.createElement("small");
    name.textContent = user.display_name || "Không có tên hiển thị";
    identity.append(name);

    const roles = document.createElement("td");
    roles.className = "role-list";
    roles.textContent = user.roles.length ? user.roles.join(", ") : "none";

    const action = document.createElement("td");
    const controls = document.createElement("div");
    controls.className = "role-action";
    const select = document.createElement("select");
    select.setAttribute("aria-label", "Role mới của " + user.email);
    ["staff", "manager"].forEach((role) => {
      const option = document.createElement("option");
      option.value = role;
      option.textContent = role;
      option.selected = user.roles.includes(role);
      select.append(option);
    });
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "Lưu";
    button.onclick = async () => {
      button.disabled = true;
      try {
        await api("/auth/users/" + user.id + "/role", {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({role: select.value}),
        });
        await loadUsers();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        button.disabled = false;
      }
    };
    controls.append(select, button);
    action.append(controls);

    const active = document.createElement("td");
    active.textContent = user.is_active ? "Đang hoạt động" : "Đã khoá";

    row.append(identity, roles, action, active);
    $("users").append(row);
  }

  $("login-form").onsubmit = async (event) => {
    event.preventDefault();
    setStatus("Đang đăng nhập…");
    try {
      const data = await api("/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          email: $("email").value.trim(),
          password: $("password").value,
        }),
      });
      if (!(data.user.roles || []).includes("admin")) {
        token = "";
        throw new Error("Tài khoản này không có quyền admin.");
      }
      token = data.access_token;
      localStorage.setItem("rag-access-token", token);
      localStorage.setItem("rag-session-user-id", data.user.id);
      showAdmin(data.user);
      await loadUsers();
    } catch (error) {
      logout(error.message);
      $("password").value = "";
      setStatus(error.message, true);
    }
  };

  $("refresh").onclick = loadUsers;
  $("logout").onclick = () => logout();

  (async () => {
    if (!token) {
      showLogin();
      return;
    }
    try {
      const user = await api("/auth/me");
      if (!(user.roles || []).includes("admin")) {
        logout("Chỉ admin mới được vào trang này.");
        return;
      }
      showAdmin(user);
      await loadUsers();
    } catch (error) {
      logout("Phiên đăng nhập hết hạn.");
    }
  })();
</script>
</body>
</html>
